name: Update Channels JSON

on:
  schedule:
    # Chạy mỗi 1 giờ, bắt đầu ở phút 07 — tránh tranh chấp với các job trên GitHub
    - cron: "7 * * * *"
  workflow_dispatch: # Cho phép trigger thủ công từ Actions tab

# Chỉ cho phép một lần chạy cùng lúc — nếu job cũ chưa xong thì hủy
concurrency:
  group: scrape-channels
  cancel-in-progress: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15  # Tăng từ 10 lên 15 để đủ time với parallel upload

    # Least privilege — chỉ cấp đúng quyền cần thiết
    permissions:
      contents: write
      actions: none
      checks: none
      deployments: none
      id-token: none
      issues: none
      packages: none
      pages: none
      pull-requests: none
      repository-projects: none
      security-events: none
      statuses: none

    steps:
      # Kiểm tra giờ Việt Nam — skip nếu trong khung 02:00–15:00 (ít trận nhất)
      - name: Check allowed time (VN)
        id: timecheck
        run: |
          HOUR=$(TZ='Asia/Ho_Chi_Minh' date +%H)
          if [ "$HOUR" -ge 2 ] && [ "$HOUR" -lt 15 ]; then
            echo "⏭️ Skipping — off-peak hours (${HOUR}h VN)"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "▶️ Running — active hours (${HOUR}h VN)"
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      # Pin theo commit hash cụ thể — chống supply chain attack qua tag mutation
      - name: Checkout
        if: steps.timecheck.outputs.skip != 'true'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js 20
        if: steps.timecheck.outputs.skip != 'true'
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 20

      # npm install: cài đặt dependencies trực tiếp từ package.json
      - name: Install dependencies
        if: steps.timecheck.outputs.skip != 'true'
        run: npm install

      - name: Run scraper
        if: steps.timecheck.outputs.skip != 'true'
        run: node fetch-channel.js
        env:
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          # TEST_LINK: "/ten-tran-dau"  # Uncomment để inject link test thủ công

      - name: Commit & push channels.json
        if: steps.timecheck.outputs.skip != 'true'
        run: |
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add channels.json

          # Không commit nếu không có thay đổi thực sự
          if git diff --cached --quiet; then
            echo "✅ No changes detected — skipping commit"
            exit 0
          fi

          git commit -m "chore: auto-update channels [skip ci]"

          # Rebase để tránh conflict nếu có push song song
          git pull --rebase --autostash
          git push
